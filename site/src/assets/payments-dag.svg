<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 484" class="dag" role="img" aria-labelledby="dag-title dag-desc">
<title id="dag-title">How the payments data is built</title>
<desc id="dag-desc">Left to right. Published by others: SEC filings, IR releases, Company statements, Official totals, Rate sheets, benchmarks, Product and deal pages, HTTP Archive, npm and PyPI, Greenhouse, Ashby, SEC EDGAR APIs. Stored as read: kpi_disclosures_*.json, private_metrics.json, denominators.json, waterfall_inputs.json, products, events .json, data/raw/payments/, job counts only. Transform: economics.py, ledger.py, share.py, publish.py (curated), webtech.py, devstats.py, jobs.py, formd.py. Marts (data/marts/payments): waterfall_lines, take_rates, ledger_timeline, share_lenses, products, events, metric_dictionary, CI views. Grade and gate: evaluate.py, pandera gate, regression guard. Published: facts/payments.json, this page. Dashed boxes exist only after the scheduled CI run.</desc>
<style>
.dag{font-family:var(--font-sans,system-ui,sans-serif);width:100%;min-width:760px;height:auto;display:block}
.dag .col{font-size:11px;font-weight:600;fill:var(--ink)}
.dag .step{font-size:9.5px;font-style:italic;fill:var(--ink-3)}
.dag .box{fill:var(--bg);stroke:var(--border-strong);stroke-width:1}
.dag .box.ci{stroke-dasharray:4 3;stroke:var(--ink-3)}
.dag .lbl{font-size:10.5px;fill:var(--ink)}
.dag .sub{font-size:9px;fill:var(--ink-3)}
.dag .edge{fill:none;stroke:var(--ink-3);stroke-width:0.9;opacity:0.75}
.dag .edge.ci{stroke-dasharray:3 3}
.dag .head{fill:var(--ink-3)}
.dag .legend{font-size:9.5px;fill:var(--ink-3)}
</style>
<defs><marker id="dag-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="head"/></marker></defs>
