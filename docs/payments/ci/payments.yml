# Install: copy to .github/workflows/payments.yml. Parked here because this session's token cannot push workflow files.
# Add the FEEDS entry in site/src/lib/freshness.ts when the page status becomes live.
name: payments

on:
  schedule:
    # Filings are quarterly, npm and job boards move weekly, HTTP Archive crawls monthly. Weekly is
    # often enough that a new quarter or crawl appears within a week, and rare enough that the npm,
    # Greenhouse and Ashby endpoints see one polite request per package or board.
    - cron: "41 7 * * 3"   # Wednesdays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The contact comes only from the Actions secret; the payments SEC universe refuses to run without it.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # Every source is continue-on-error and publish runs anyway (CLAUDE.md rule 5): an unreachable
      # job board or a renamed HTTP Archive endpoint costs the page that panel and a failed check,
      # not the curated sections that need no network at all.
      - name: SEC companyfacts, payments universe
        id: sec
        continue-on-error: true
        run: |
          uv run python -m pipelines.sec.ingest --universe payments
          uv run python -m pipelines.sec.transform_payments

      - name: HTTP Archive technology adoption
        id: webtech
        continue-on-error: true
        run: uv run python -m pipelines.payments.webtech

      - name: npm and PyPI downloads
        id: devstats
        continue-on-error: true
        run: uv run python -m pipelines.payments.devstats

      - name: Job-board counts (counts only, no job text)
        id: jobs
        continue-on-error: true
        run: uv run python -m pipelines.payments.jobs

      - name: SEC Form D monitor
        id: formd
        continue-on-error: true
        run: uv run python -m pipelines.payments.formd

      - name: Validate the curated reference files
        id: reference
        continue-on-error: true
        run: uv run python -m pipelines.payments.reference

      - name: Rebuild marts and facts
        id: publish
        if: always()
        continue-on-error: true
        run: uv run python -m pipelines.payments.publish

      # Same split as power.yml: snapshots are the append-only archive and are kept even on a bad
      # run; marts and facts reach main only when publish succeeded.
      - name: Commit and push data
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/
          else
            echo "::warning::publish did not succeed; committing the archive only and leaving data/facts and data/marts as they were"
            git add data/raw data/snapshots 2>/dev/null || true
            git checkout -- data/facts data/marts 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(payments): weekly refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      - name: Surface step failures
        if: >
          always() && (
          steps.sec.outcome == 'failure' || steps.webtech.outcome == 'failure' ||
          steps.devstats.outcome == 'failure' || steps.jobs.outcome == 'failure' ||
          steps.formd.outcome == 'failure' || steps.reference.outcome == 'failure' ||
          steps.publish.outcome == 'failure' )
        run: |
          echo "::error::a payments step failed (sec=${{ steps.sec.outcome }}, webtech=${{ steps.webtech.outcome }}, devstats=${{ steps.devstats.outcome }}, jobs=${{ steps.jobs.outcome }}, formd=${{ steps.formd.outcome }}, reference=${{ steps.reference.outcome }}, publish=${{ steps.publish.outcome }})"
          exit 1
