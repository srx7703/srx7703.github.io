name: deploy-site

on:
  push:
    branches: [main]
  # Data commits are pushed with GITHUB_TOKEN, which never fires `push` workflows; rebuild after
  # every data workflow instead so the "data as of" stamps stay current.
  #
  # Deliberately `completed`, not `success`: a data run that loses one source still commits the
  # sources that worked and exits 1, and that partial refresh should still reach the site. The
  # protection against publishing a blanked page lives on the writing side instead — a publish step
  # refuses to replace a good facts file with an emptier one, so there is nothing bad to deploy.
  workflow_run:
    workflows: [snapshot-predmarkets, refresh-weekly, valuation]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        # npm install (not ci): lockfiles written on macOS omit Linux-only optional bindings
        # (@astrojs/compiler-binding-*, @emnapi/*), which makes `npm ci` fail on ubuntu runners.
        run: npm install --no-audit --no-fund
        working-directory: site
      - name: Tests (pipelines + prose-numbers guardrail)
        run: |
          pip install --quiet uv
          uv sync --frozen
          uv run pytest -q -p no:warnings
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
