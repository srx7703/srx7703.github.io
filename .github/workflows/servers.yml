name: servers

on:
  schedule:
    # Taiwan makers publish monthly revenue by the 10th; the 11th and 12th catch late filers.
    - cron: "17 9 11,12 * *"
    # Quarterly statements (MOPS, SEC, mainland) arrive over a few weeks after each quarter; weekly is enough.
    - cron: "17 9 * * 4"   # Thursdays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: servers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # Every source fails on its own: MOPS throttles bursts and sometimes refuses overseas clients, SEC and East
      # Money have their own outages. A failed source costs the page fresh rows for that source, never the page.
      - name: Taiwan monthly revenue (MOPS)
        id: monthly
        continue-on-error: true
        run: uv run python -m pipelines.servers.tw monthly

      - name: Taiwan quarterly statements (MOPS)
        id: quarterly
        continue-on-error: true
        run: uv run python -m pipelines.servers.tw quarterly

      - name: SEC filings
        id: sec
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run python -m pipelines.servers.sec fetch

      - name: Mainland statements (East Money)
        id: cn
        continue-on-error: true
        run: uv run python -m pipelines.servers.cn fetch

      - name: Exchange rates (FRED)
        id: fx
        continue-on-error: true
        run: uv run python -m pipelines.servers.fx

      - name: Rebuild marts and facts
        id: publish
        if: always()
        continue-on-error: true
        run: uv run python -m pipelines.servers.publish

      # Same split as the other workflows: the raw archive is committed even on a bad run; facts and marts only
      # when publish succeeded, so a half-built facts file never reaches main and the live page.
      - name: Commit and push data
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/
          else
            echo "::warning::publish did not succeed; committing the archive only"
            git add data/raw data/snapshots
            git checkout -- data/facts data/marts 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(servers): refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      - name: Surface step failures
        if: >
          always() && (
          steps.monthly.outcome == 'failure' || steps.quarterly.outcome == 'failure' ||
          steps.sec.outcome == 'failure' || steps.cn.outcome == 'failure' || steps.fx.outcome == 'failure' ||
          steps.publish.outcome == 'failure' )
        run: |
          echo "::error::a servers step failed (monthly=${{ steps.monthly.outcome }}, quarterly=${{ steps.quarterly.outcome }}, sec=${{ steps.sec.outcome }}, cn=${{ steps.cn.outcome }}, fx=${{ steps.fx.outcome }}, publish=${{ steps.publish.outcome }})"
          exit 1
