name: cyber

on:
  schedule:
    # Weekly, on Thursdays, away from the other weekly jobs (Monday valuation, Tuesday power, Wednesday
    # surgical). The consensus it publishes is captured by the Monday valuation run; this job adds the
    # A-share valuation history, validates the hand-curated private-company layer, and rebuilds the marts
    # and facts the page reads.
    - cron: "41 8 * * 4"   # Thursdays 08:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyber
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # East Money's daily valuation history for the A-share listings. A source outage costs the China
      # panel its newest day, not the page: the last snapshot stays with its "as of" stamp.
      - name: A-share valuation history (East Money)
        id: china
        continue-on-error: true
        run: uv run python -m pipelines.cyber.valuation_history_em

      # The curated layer is hand-edited, so it is validated on every run rather than only when somebody
      # remembers. A row that lost its source URL, or that links a paid database, fails here and not on the page.
      - name: Validate the curated reference files
        id: reference
        continue-on-error: true
        run: uv run python -m pipelines.cyber.reference

      - name: Rebuild marts and facts
        id: publish
        if: always()
        continue-on-error: true
        run: uv run python -m pipelines.cyber.publish

      # Same split as the valuation and power workflows: data/snapshots is the append-only archive and is
      # committed even on a bad run; data/facts and data/marts are what the page renders, and a publish that
      # died part-way must not reach main, where deploy-site would rebuild the live page from it.
      - name: Commit and push data
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/
          else
            echo "::warning::publish did not succeed; committing the archive only and leaving data/facts and data/marts as they were"
            git add data/snapshots
            git checkout -- data/facts data/marts 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(cyber): weekly refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      # Every continue-on-error step must be named here or its failure is invisible: the step's conclusion
      # goes green and only `outcome` remembers what happened.
      - name: Surface step failures
        if: >
          always() && (
          steps.china.outcome == 'failure' || steps.reference.outcome == 'failure' ||
          steps.publish.outcome == 'failure' )
        run: |
          echo "::error::a cyber step failed (china=${{ steps.china.outcome }}, reference=${{ steps.reference.outcome }}, publish=${{ steps.publish.outcome }})"
          exit 1
