name: refresh-weekly

on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC: SEC XBRL refresh, FOMC history backfill + archive, marts + facts, macro layer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: SEC XBRL ingest + transform
        id: sec
        continue-on-error: true
        run: |
          uv run python -m pipelines.sec.ingest
          uv run python -m pipelines.sec.transform

      - name: FOMC history backfill
        id: backfill
        continue-on-error: true
        run: uv run python -m pipelines.predmarkets.backfill --set fomc

      # decision markets that closed before the snapshot pipeline saw them; a no-op once all are stored
      - name: FOMC closed-meeting archive
        id: archive
        continue-on-error: true
        run: uv run python -m pipelines.predmarkets.archive

      - name: Rebuild marts and facts
        id: publish
        continue-on-error: true
        run: |
          uv run python -m pipelines.predmarkets.publish
          uv run python -m pipelines.statarb.publish
          uv run python -m pipelines.finllm.publish

      - name: FOMC macro layer and release event study
        id: macro
        continue-on-error: true
        run: uv run python -m pipelines.macro.build

      - name: Commit and push data
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(weekly): SEC + FOMC history refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            # -X theirs: on a conflict in generated files, keep this run's version
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      - name: Surface step failures
        if: steps.sec.outcome == 'failure' || steps.backfill.outcome == 'failure' || steps.archive.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.macro.outcome == 'failure'
        run: |
          echo "::error::a refresh step failed (sec=${{ steps.sec.outcome }}, backfill=${{ steps.backfill.outcome }}, archive=${{ steps.archive.outcome }}, publish=${{ steps.publish.outcome }}, macro=${{ steps.macro.outcome }})"
          exit 1
