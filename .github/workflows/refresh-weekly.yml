name: refresh-weekly

on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC: SEC XBRL refresh, FOMC history backfill, marts + facts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: SEC XBRL ingest + transform
        id: sec
        continue-on-error: true
        run: |
          uv run python -m pipelines.sec.ingest
          uv run python -m pipelines.sec.transform

      - name: FOMC history backfill
        id: backfill
        continue-on-error: true
        run: uv run python -m pipelines.predmarkets.backfill --set fomc

      - name: Rebuild marts and facts
        run: |
          uv run python -m pipelines.predmarkets.publish
          uv run python -m pipelines.statarb.publish

      - name: Commit and push data
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(weekly): SEC + FOMC history refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      - name: Surface step failures
        if: steps.sec.outcome == 'failure' || steps.backfill.outcome == 'failure'
        run: |
          echo "::error::a refresh step failed (sec=${{ steps.sec.outcome }}, backfill=${{ steps.backfill.outcome }})"
          exit 1
