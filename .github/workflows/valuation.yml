name: valuation

on:
  schedule:
    # Prices move every day; the consensus behind a forward PE moves when brokers publish, which is
    # a weekly event at most. Two crons, one workflow, distinguished by github.event.schedule.
    - cron: "47 6 * * 1-5"   # weekdays 06:47 UTC: prices + FX, then rebuild the pages
    - cron: "47 7 * * 1"     # Mondays 07:47 UTC: the full run, including analyst estimates
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (prices only) or weekly (everything)"
        default: weekly
        type: choice
        options: [daily, weekly]

permissions:
  contents: write

concurrency:
  group: valuation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 7 * * 1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      # Every fetch step is continue-on-error and every publish step runs anyway: one source being
      # down must never throw away the sources that worked, and last week's snapshot stays on the
      # page with an honest "data as of" stamp rather than the page going blank.
      - name: Exchange rates
        id: fx
        continue-on-error: true
        run: uv run python -m pipelines.valuation.fx

      - name: Prices
        id: prices
        continue-on-error: true
        run: uv run python -m pipelines.valuation.prices

      - name: Analyst estimates (Yahoo)
        id: est_yf
        if: steps.mode.outputs.mode == 'weekly'
        continue-on-error: true
        run: uv run python -m pipelines.valuation.estimates_yf

      - name: Analyst estimates (East Money, A-shares)
        id: est_em
        if: steps.mode.outputs.mode == 'weekly'
        continue-on-error: true
        run: uv run python -m pipelines.valuation.estimates_em

      - name: Fundamentals
        id: fundamentals
        if: steps.mode.outputs.mode == 'weekly'
        continue-on-error: true
        run: uv run python -m pipelines.valuation.fundamentals

      - name: Rebuild marts and facts
        id: publish
        if: always()
        continue-on-error: true
        run: uv run python -m pipelines.valuation.publish

      - name: Score the pre-registered evaluation
        id: evaluate
        if: always()
        continue-on-error: true
        run: uv run python -m pipelines.valuation.evaluate

      # What gets staged depends on whether publish succeeded, because the two halves of data/ carry
      # different risk. data/raw and data/snapshots are the append-only archive: nothing on the site
      # reads them, and today's closing price cannot be re-fetched tomorrow, so throwing the run away
      # would lose it for good. data/facts and data/marts are exactly what the two pages render, and
      # a publish that died part-way through can leave one of them blanked or truncated — committing
      # that pushes it to main, where deploy-site rebuilds the live pages from it before this job's
      # own `exit 1` has surfaced anything. So a failed publish commits the archive and leaves the
      # published layer exactly as it was. (deploy-site must also stop rebuilding after a failed
      # valuation run; that gate lives in deploy-site.yml.)
      - name: Commit and push data
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/
          else
            echo "::warning::publish did not succeed; committing the archive only and leaving data/facts and data/marts as they were"
            git add data/raw data/snapshots
            # restore anything publish half-wrote, so it cannot be committed and cannot block the rebase
            git checkout -- data/facts data/marts 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(valuation): ${{ steps.mode.outputs.mode }} refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            # -X theirs: on a conflict in generated files, keep this run's version
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      # Every step that runs under continue-on-error has to be named here, or its failure is invisible:
      # continue-on-error turns the step's conclusion green and only `outcome` still remembers. The
      # scorer was missing from this list, so a crash in the module that decides whether the project's
      # own claims can be checked left the job green.
      - name: Surface step failures
        if: >
          always() && (
          steps.fx.outcome == 'failure' || steps.prices.outcome == 'failure' ||
          steps.est_yf.outcome == 'failure' || steps.est_em.outcome == 'failure' ||
          steps.fundamentals.outcome == 'failure' || steps.publish.outcome == 'failure' ||
          steps.evaluate.outcome == 'failure' )
        run: |
          echo "::error::a valuation step failed (fx=${{ steps.fx.outcome }}, prices=${{ steps.prices.outcome }}, est_yf=${{ steps.est_yf.outcome }}, est_em=${{ steps.est_em.outcome }}, fundamentals=${{ steps.fundamentals.outcome }}, publish=${{ steps.publish.outcome }}, evaluate=${{ steps.evaluate.outcome }})"
          exit 1
