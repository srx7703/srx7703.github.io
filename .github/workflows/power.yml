name: power

on:
  schedule:
    # Every source here is monthly or slower: EIA publishes 860M and 861M once a month, the STEO
    # once a month, and PJM its load forecast once a year. A daily cron would re-download 30 MB to
    # write an identical snapshot. Weekly is already more often than the data changes, and it means
    # a newly published month appears within a week rather than up to a month late.
    - cron: "23 8 * * 2"   # Tuesdays 08:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: power
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # Each fetch is continue-on-error and publish runs anyway. The three sources fail
      # independently — EIA moves files between /xls/ and /archive/xls/, PJM renames its workbooks
      # each January — and one being unreachable must cost the page that section with a failed check
      # beside it, not the whole page. Last month's snapshot stays with an honest "as of" stamp.
      - name: EIA generator inventory, retirements and deferrals
        id: generators
        continue-on-error: true
        run: uv run python -m pipelines.power.generators

      - name: EIA retail sales and Short-Term Energy Outlook
        id: demand
        continue-on-error: true
        run: uv run python -m pipelines.power.demand

      - name: PJM load forecast and large-load adjustment
        id: gridops
        continue-on-error: true
        run: uv run python -m pipelines.power.gridops

      # The curated layer is hand-edited, so it is validated on every run rather than only when
      # somebody remembers. A row that lost its source URL fails here, before it reaches the page.
      - name: Validate the curated reference files
        id: reference
        continue-on-error: true
        run: uv run python -m pipelines.power.reference

      - name: Rebuild marts and facts
        id: publish
        if: always()
        continue-on-error: true
        run: uv run python -m pipelines.power.publish

      # Same split as the valuation workflow, for the same reason: data/raw and data/snapshots are
      # the append-only archive and a month that has rolled off EIA's site cannot be re-fetched, so
      # they are committed even on a bad run. data/facts and data/marts are what the page renders,
      # and a publish that died part-way can blank a section; that must not reach main, where
      # deploy-site would rebuild the live page from it.
      - name: Commit and push data
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/
          else
            echo "::warning::publish did not succeed; committing the archive only and leaving data/facts and data/marts as they were"
            git add data/raw data/snapshots
            git checkout -- data/facts data/marts 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data(power): weekly refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 15
          done
          exit 1

      # Every continue-on-error step must be named here or its failure is invisible: the step's
      # conclusion goes green and only `outcome` remembers what happened.
      - name: Surface step failures
        if: >
          always() && (
          steps.generators.outcome == 'failure' || steps.demand.outcome == 'failure' ||
          steps.gridops.outcome == 'failure' || steps.reference.outcome == 'failure' ||
          steps.publish.outcome == 'failure' )
        run: |
          echo "::error::a power step failed (generators=${{ steps.generators.outcome }}, demand=${{ steps.demand.outcome }}, gridops=${{ steps.gridops.outcome }}, reference=${{ steps.reference.outcome }}, publish=${{ steps.publish.outcome }})"
          exit 1
