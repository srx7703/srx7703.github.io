[project]
name = "portfolio"
version = "0.1.0"
description = "Data pipelines and static site for Ruoxuan Song's data-analysis portfolio."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pandera[polars]>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pipelines", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
